image: docker:19.03.1

# Docker image build: broken until ticket #13 removes it (the Dockerfile runs `npm start`, which no longer exists).
build:
  only:
    - tags
  services:
    - docker:19.03.1-dind
  script:
    - apk add --update docker
    - docker login
      --username gitlab-ci-token
      --password $CI_JOB_TOKEN $CI_REGISTRY
    - docker build
      --force-rm
      --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
      --build-arg REPO_USER=gitlab-ci-token 
      --build-arg REPO_TOKEN=${CI_JOB_TOKEN}
      --build-arg http_proxy=$http_proxy
      --build-arg https_proxy=$https_proxy
      .
    - docker push
      $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
    - docker rmi
      --force
      $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME

# Feedback loop (ticket #4): unit tests, build, egress test. Untested on GitLab runners.
test:
  image: mcr.microsoft.com/playwright:v1.65.0-noble
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm ci
    - npm test
    - npm run build
    - npm run e2e
